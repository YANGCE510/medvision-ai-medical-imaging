spring.application.name=PPGL-Analyze
server.port=${SERVER_PORT:8080}
spring.mvc.async.request-timeout=300000
debug=false
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.ppgl=INFO

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ppgl_analyze}?useUnicode=true&characterEncoding=utf8&serverTimezone=${MYSQL_TIMEZONE:Asia/Shanghai}&useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

ppgl.data-root=${PPGL_DATA_ROOT:${user.home}/ppgl-assist-data}
ppgl.upload.ct-dir=${ppgl.data-root}/uploads/ct-images
ppgl.analysis.result-dir=${ppgl.data-root}/uploads/analysis-results
ppgl.analysis.job-dir=${ppgl.data-root}/jobs
ppgl.analysis.python-bin=python3
ppgl.analysis.python-worker=python-worker/worker.py
ppgl.analysis.task-timeout-minutes=5
ppgl.jetson.base-url=${PPGL_JETSON_BASE_URL:http://127.0.0.1:8001}
ppgl.jetson.task-ids=[291,292,293,294,295]
ppgl.jetson.model=3d_fullres
ppgl.jetson.trainer=nnUNetTrainerNoMirroring
ppgl.jetson.folds=[0]
ppgl.jetson.tta=false
ppgl.pipeline.enabled=${PPGL_PIPELINE_ENABLED:true}
ppgl.pipeline.base-url=${PPGL_PIPELINE_BASE_URL:http://127.0.0.1:8000}
ppgl.pipeline.mode=${PPGL_PIPELINE_MODE:abdomen}
ppgl.pipeline.timeout-minutes=${PPGL_PIPELINE_TIMEOUT_MINUTES:30}
ppgl.llm.chat-url=${PPGL_LLM_CHAT_URL:${ppgl.pipeline.base-url}/api/llm/chat/stream}
ppgl.auth.jwt-secret=${PPGL_AUTH_JWT_SECRET}
ppgl.auth.jwt-ttl-minutes=${PPGL_AUTH_JWT_TTL_MINUTES:120}
ppgl.internal.api-key=${PPGL_INTERNAL_API_KEY}
ppgl.report.chat.max-messages=100
ppgl.report.chat.max-content-chars=4000
medical.case-root-dir=${ppgl.data-root}/uploads/viewer-cases
spring.servlet.multipart.max-file-size=${PPGL_MAX_UPLOAD_SIZE:2GB}
spring.servlet.multipart.max-request-size=${PPGL_MAX_UPLOAD_SIZE:2GB}
