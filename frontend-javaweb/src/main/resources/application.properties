spring.application.name=PPGL-Analyze
server.port=8080
spring.mvc.async.request-timeout=300000
debug=false
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.ppgl=INFO

spring.datasource.url=jdbc:mysql://localhost:3306/ppgl_analyze?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

ppgl.upload.ct-dir=uploads/ct-images
ppgl.analysis.result-dir=uploads/analysis-results
ppgl.analysis.job-dir=jobs
ppgl.analysis.python-bin=python3
ppgl.analysis.python-worker=python-worker/worker.py
ppgl.analysis.task-timeout-minutes=5
ppgl.jetson.base-url=http://127.0.0.1:8001
ppgl.jetson.task-ids=[291,292,293,294,295]
ppgl.jetson.model=3d_fullres
ppgl.jetson.trainer=nnUNetTrainerNoMirroring
ppgl.jetson.folds=[0]
ppgl.jetson.tta=false
ppgl.pipeline.enabled=true
ppgl.pipeline.base-url=http://127.0.0.1:8000
ppgl.pipeline.mode=abdomen
ppgl.pipeline.timeout-minutes=30
ppgl.llm.chat-url=http://127.0.0.1:8000/api/llm/chat/stream
ppgl.auth.jwt-secret=${PPGL_AUTH_JWT_SECRET}
ppgl.auth.jwt-ttl-minutes=${PPGL_AUTH_JWT_TTL_MINUTES:120}
ppgl.internal.api-key=${PPGL_INTERNAL_API_KEY}
ppgl.report.chat.max-messages=100
ppgl.report.chat.max-content-chars=4000
medical.case-root-dir=uploads/viewer-cases
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
