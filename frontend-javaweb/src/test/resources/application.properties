spring.datasource.url=jdbc:h2:mem:ppgl_analyze;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
ppgl.upload.ct-dir=target/test-uploads/ct-images
ppgl.analysis.result-dir=target/test-uploads/analysis-results
ppgl.analysis.task-timeout-minutes=5
ppgl.jetson.base-url=http://127.0.0.1:8000/api
ppgl.pipeline.base-url=http://127.0.0.1:8000
ppgl.auth.jwt-secret=test-only-secret-that-is-at-least-32-bytes-long
ppgl.internal.api-key=test-only-internal-api-key
medical.case-root-dir=target/test-uploads/viewer-cases
debug=false
logging.level.root=INFO
logging.level.org.springframework=INFO
